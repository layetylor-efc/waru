<main id="app">

<script>(function(root){
  'use strict';
  const DIRS = [{x:0,y:1,name:'DOWN',arrow:'↓'},{x:-1,y:0,name:'LEFT',arrow:'←'},{x:0,y:-1,name:'UP',arrow:'↑'},{x:1,y:0,name:'RIGHT',arrow:'→'}];
  const key=(x,y)=>x+','+y;
  const count=n=>{let c=0;while(n){c+=n&1;n>>>=1;}return c;};
  const clone=s=>({...s,crates:s.crates.map(c=>({...c}))});
  function initial(level){return {x:level.start[0],y:level.start[1],dir:0,stars:0,fish:0,broken:0,crates:(level.crates||[]).map(c=>({x:c[0],y:c[1]})),moves:0,paws:1};}
  function solid(level,s,x,y){
    if(x<0||y<0||y>=level.map.length||x>=level.map[0].length)return true;
    const t=level.map[y][x];
    if(t==='#')return true;
    if(t==='P'){const i=level.soft.findIndex(p=>p[0]===x&&p[1]===y);return !(s.broken&(1<<i));}
    return false;
  }
  function trace(level,source,dir){
    const s=clone(source);s.dir=dir;
    const path=[],seen=new Set(),triggered=new Set();let failed=false,won=false,loop=false;
    for(let i=0;i<320;i++){
      const signature=key(s.x,s.y)+':'+s.dir+':'+s.crates.map(c=>key(c.x,c.y)).sort().join(';')+':'+Array.from(triggered).sort().join(';');
      if(seen.has(signature)){loop=true;break;}seen.add(signature);
      const d=DIRS[s.dir],x=s.x+d.x,y=s.y+d.y;
      if(solid(level,s,x,y))break;
      const crate=s.crates.find(c=>c.x===x&&c.y===y);
      if(crate){
        const cx=x+d.x,cy=y+d.y;
        if(solid(level,s,cx,cy)||s.crates.some(c=>c.x===cx&&c.y===cy)||level.map[cy][cx]==='G'||level.map[cy][cx]==='X')break;
        crate.x=cx;crate.y=cy;
      }
      s.x=x;s.y=y;
      level.stars.forEach((p,j)=>{if(p[0]===x&&p[1]===y)s.stars|=1<<j;});
      (level.fish||[]).forEach((p,j)=>{if(p[0]===x&&p[1]===y)s.fish|=1<<j;});
      const tile=level.map[y][x];
      if(tile==='T'&&!triggered.has(key(x,y))){s.dir=(s.dir+1)%4;triggered.add(key(x,y));}
      path.push({x,y,dir:s.dir,stars:s.stars,fish:s.fish,crates:s.crates.map(c=>({...c}))});
      if(tile==='X'){failed=true;break;}
      if(tile==='G'){won=count(s.stars)===level.stars.length;break;}
    }
    if(path.length)s.moves++;
    return {state:s,path,failed,won,loop};
  }
  function pulse(level,source){
    if(source.paws<=0)return null;
    const i=level.soft.findIndex((p,j)=>!(source.broken&(1<<j))&&Math.abs(p[0]-source.x)+Math.abs(p[1]-source.y)===1);
    if(i<0)return null;
    const s=clone(source);s.broken|=1<<i;s.paws--;s.moves++;return s;
  }
  function solve(level,source=initial(level),limit=50000){
    const fingerprint=s=>[s.x,s.y,s.stars,s.broken,s.crates.map(c=>key(c.x,c.y)).sort().join(';')].join('|');
    const queue=[{s:clone(source),route:[]}],seen=new Set([fingerprint(source)]);
    for(let i=0;i<queue.length&&i<limit;i++){
      const n=queue[i];
      for(let d=0;d<4;d++){
        const t=trace(level,n.s,d);
        if(t.failed||!t.path.length)continue;
        const route=n.route.concat(d);
        if(t.won)return {route,visited:i+1};
        const k=fingerprint(t.state);if(!seen.has(k)){seen.add(k);queue.push({s:t.state,route});}
      }
    }
    return null;
  }

  const api={DIRS,count,clone,initial,solid,trace,pulse,solve,prepare};
  root.NekoCore=api;if(typeof module!=='undefined')module.exports=api;

async function enableTilt(){

  if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){toast('傾きの許可がありません。矢印ボタンで遊べます。');return;}

function orientation(e){
 if(!tilt||screen!=='game'||modalKind||animation||e.beta==null||e.gamma==null)return;
 const angle=(window.screen.orientation?.angle??window.orientation??0)*Math.PI/180;
 const gx=e.gamma*Math.cos(angle)+e.beta*Math.sin(angle),gy=e.beta*Math.cos(angle)-e.gamma*Math.sin(angle);
 if(!tiltBase){tiltBase={x:gx,y:gy,angle};clearTimeout(sensorTimer);return;}
 if(tiltBase.angle!==angle){tiltBase=null;return;}
 const dx=gx-tiltBase.x,dy=gy-tiltBase.y,now=performance.now();
 if(Math.max(Math.abs(dx),Math.abs(dy))<12){lastTilt=0;return;}
 if(Math.max(Math.abs(dx),Math.abs(dy))<20||now-lastTilt<750)return;
 const dir=Math.abs(dx)>Math.abs(dy)?dx>0?3:1:dy>0?0:2;
 if(lastTilt&&dir===state.dir)return;
 if(move(dir))lastTilt=now;
}
