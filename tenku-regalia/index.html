<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07182d"><title>天空のレガリアシューティング</title><link rel="icon" href="assets/icon.webp"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="skin.css"><link rel="stylesheet" href="battle.css"><style>.waru-link{position:fixed;left:max(10px,env(safe-area-inset-left));top:max(6px,env(safe-area-inset-top));z-index:102;padding:5px 9px;color:#e6f6ff;background:#081c30cc;border:1px solid #659fbc8c;border-radius:18px;text-decoration:none;font:11px system-ui;opacity:.82}.waru-link:hover{opacity:1}</style></head>
<body><a class="waru-link" href="../#tenku-regalia" target="_top">← 作品一覧へ</a><main id="app"><div id="loading"><div class="sigil">✧</div><p>天空への扉を開いています…</p></div><div id="menus"></div><section id="battle" hidden><canvas id="game" aria-label="天空のレガリア 戦闘画面"></canvas><header class="battle-hud"><div class="portrait"></div><div class="vitals"><div class="hud-name"><b id="heroName">セレス</b> <span id="levelLabel">Lv. 1</span></div><div class="bar hp"><i id="hpbar"></i><span id="hplabel"></span></div><div class="bar mp"><i id="mpbar"></i><span id="mplabel"></span></div></div><div class="timer"><b id="clock">00:00</b><small id="score">0 pt</small></div><button id="pause" class="pause" aria-label="一時停止"><img src="assets/ui/pause.webp" alt=""></button></header><div class="battle-progress"><span id="objective"></span><span id="killCount"></span></div><div id="bossHud" hidden><div class="boss-title"><em id="bossTag">BOSS</em><span id="enemyHpText">敵のHP</span></div><div class="bar boss"><i id="bossbar"></i></div></div><div id="comboDisplay"><strong id="comboNumber">0</strong><span>COMBO</span><div class="combo-track"><i id="comboTime"></i></div><small id="comboRank"></small></div><div id="battleBanner"></div><button id="burstButton" class="overdrive" aria-label="覚醒"><span>✧ 覚醒</span><small id="rageLabel">0%</small></button>
<div id="controls">
 <div class="movement"><div id="movementPad" role="group" aria-label="十字パッド・上下左右移動"><div class="pad-ring"></div><button data-dir="up" aria-label="上に移動">▲</button><button data-dir="left" aria-label="左に移動">◀</button><button data-dir="right" aria-label="右に移動">▶</button><button data-dir="down" aria-label="下に移動">▼</button><div id="padKnob"></div></div><small>十字操作 / 画面ドラッグ</small></div>
 <div class="battle-actions">
  <button class="battle-chip hex-bomb-chip" data-press="bomb" id="hexBombButton" aria-label="HEX BREATH ボム MP60"><span>HEX ボム</span><small>MP 60</small></button>
  <button class="battle-chip skill-one" data-press="skill" id="skillButton" aria-label="スキル1 MP20"><img src="assets/ui/skill-blue.webp" alt=""><span>スキル1</span><small>MP 20</small></button>
  <button class="battle-chip skill-two" data-press="skill2" id="skill2Button" aria-label="スキル2 MP30"><img src="assets/ui/skill-gold.webp" alt=""><span>スキル2</span><small>MP 30</small></button>
  <button class="battle-chip dash-chip" data-press="dash" id="dashButton" aria-label="ダッシュ"><img src="assets/ui/dash.webp" alt=""><span>ダッシュ</span></button>
  <button class="battle-chip attack-chip" data-hold="attack" id="attackButton" aria-label="攻撃 長押しで連射"><img src="assets/ui/attack.webp" alt=""><span>攻撃</span></button>
  <button class="battle-chip jump-chip" data-press="jump" id="jumpButton" aria-label="ジャンプ"><img src="assets/ui/jump.webp" alt=""><span>ジャンプ</span></button>
 </div>
</div><div id="perf" hidden></div></section><div id="modal" role="dialog" aria-modal="true" hidden></div><div id="toast" role="status"></div></main><script src="bootstrap.js"></script><script type="module" src="app.js"></script></body></html>
