name: Import FATE LOG character cards (once)
on:
  push:
    paths:
      - '.github/workflows/import-fatelog-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download 10 card images and validate WEBP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import time
          urls = [["01-rei.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-d600-8206-a1b3-4a5fbb2f33ed/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T08%3A10%3A53Z&ske=2026-10-15T08%3A10%3A53Z&sks=b&skv=2026-02-06&sig=ThC6eneykP%2B2uu6pM8XMHyjSFMC7B%2Bnf9kKmRZYCAAg%3D"],["02-kagerei.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-7ea0-8206-b036-1fa0f73b3311/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T10%3A59%3A48Z&ske=2026-10-15T10%3A59%3A48Z&sks=b&skv=2026-02-06&sig=/TTxb8fogkUG%2BEDmu4/vhU1W7o6QvE/YzEvYUISqUkc%3D"],["03-mirai.webp","https://oaisdmntprseasia.blob.core.windows.net/files/00000000-0970-8207-bbb7-6ea6b34fdefb/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T08%3A01%3A25Z&ske=2026-10-15T08%3A01%3A25Z&sks=b&skv=2026-02-06&sig=L/Fo19lae6y2qXMPYuXo4tNE8uSjIGA2s2vIT%2BXHV90%3D"],["04-mobius.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-5318-8206-891a-3c23a9ef8a4a/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T10%3A59%3A53Z&ske=2026-10-15T10%3A59%3A53Z&sks=b&skv=2026-02-06&sig=SC2xf4OY7WVRB4FfHC2lzcK/cvAID05QzJlH2nTWtBE%3D"],["05-chrono.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-0124-8206-b056-2b83fb87afdf/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A07%3A48Z&ske=2026-10-15T05%3A07%3A48Z&sks=b&skv=2026-02-06&sig=Kp9gzmaYCvJnZa1jSaqDHBsv4jjtaNZuRtjN6056PbU%3D"],["06-kanade.webp","https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-67f0-81f5-aac4-91f23f42d8f0/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A13%3A45Z&ske=2026-10-15T05%3A13%3A45Z&sks=b&skv=2026-02-06&sig=i5IJohfAlQHJ44qN/eX1/KsZqu2tPuiVQEsKeUQSojk%3D"],["07-sora.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-6ef4-8206-a1a1-083955032070/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A08%3A56Z&ske=2026-10-15T05%3A08%3A56Z&sks=b&skv=2026-02-06&sig=vimKPw74nEs5gJQIk1oaziUHYUfSTLtGBtreCY38/JE%3D"],["08-noah.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-702c-8206-aec5-4afc52f35f54/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A15%3A22Z&ske=2026-10-15T05%3A15%3A22Z&sks=b&skv=2026-02-06&sig=y/Iew2iiYNnb%2BS3T9kA3/dHNNd5t93NlkNPjaoE9cdY%3D"],["09-rei-mirai.webp","https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-2ce4-8209-9bc9-711c9bf57bc6/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A09%3A10Z&ske=2026-10-15T05%3A09%3A10Z&sks=b&skv=2026-02-06&sig=M5HyDEi78c5J2sMVRKoWlZO0h1YfnmTK%2B/YDGiAsenw%3D"],["10-mobius-kagerei.webp","https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-5e64-8206-8a25-594456745247/raw?se=2026-10-14T11%3A42%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=31a6dcc5-4aad-4b55-981b-418baf86b69c&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A10%3A31Z&ske=2026-10-15T05%3A10%3A31Z&sks=b&skv=2026-02-06&sig=ry2Tm1FWztjBji%2ByUk2Vwk9%2BbQXCdD5mO6T5C2lDjpc%3D"]]
          out = Path('fate-log/assets/cards')
          out.mkdir(parents=True, exist_ok=True)
          for name, url in urls:
              for attempt in range(3):
                  try:
                      with urlopen(Request(url, headers={'User-Agent':'FateLogArchiveAssets/1.0'}), timeout=35) as resp:
                          raw = resp.read()
                      if len(raw) < 10000 or not raw.startswith(b'RIFF') or raw[8:12] != b'WEBP':
                          raise ValueError(f'invalid WEBP for {name}, {len(raw)} bytes')
                      (out / name).write_bytes(raw)
                      print(f'OK {name}: {len(raw)} bytes')
                      break
                  except Exception as e:
                      if attempt == 2: raise
                      print(f'retrying {name}: {type(e).__name__}')
                      time.sleep(2)
          assert len(list(out.glob('*.webp'))) == 10, 'Not all 10 cards were saved'
          PY
      - name: Commit assets to repository
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add fate-log/assets/cards/*.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add ten FATE LOG character card artworks'
            git push
          fi
