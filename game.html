<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b45"><title>SKY DASH QUEST v1.4 96px Hero Test</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050914;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 0 116px}canvas{display:block;width:100vw;height:auto;max-height:calc(100vh - 116px);aspect-ratio:16/9;image-rendering:pixelated;background:#1689e8}.ctl{position:fixed;z-index:5;border:2px solid #fff9;border-radius:50%;width:72px;height:72px;color:white;font:bold 13px monospace;display:grid;place-items:center;user-select:none}.l{left:18px;bottom:20px}.r{left:98px;bottom:20px}.d{right:98px;bottom:96px;background:#a98514cc}.j{right:18px;bottom:96px;background:#075db5cc}.s{right:98px;bottom:16px;background:#a52b2bcc}.p{right:18px;bottom:16px;background:#7625bacc}@media(orientation:landscape){#wrap{padding:0}.ctl{width:68px;height:68px}.l{bottom:14px}.r{bottom:14px}.d{bottom:88px}.j{bottom:88px}.s,.p{bottom:12px}}</style></head><body><div id="wrap"><canvas id="c" width="960" height="540"></canvas></div><div class="ctl l" data-k="left">◀</div><div class="ctl r" data-k="right">▶</div><div class="ctl d" data-k="dash">DASH</div><div class="ctl j" data-k="jump">JUMP</div><div class="ctl s" data-k="sword">SWORD</div><div class="ctl p" data-k="shot">SHOT</div><script>
const c=document.getElementById('c'),g=c.getContext('2d');document.documentElement.style.background='#050914';g.imageSmoothingEnabled=false;let k={},p={x:150,y:410,vx:0,vy:0,ground:1,dir:1,t:0,hp:5,score:0},shots=[],enemies=[{x:650,y:410,type:0,hp:3},{x:790,y:410,type:1,hp:2},{x:860,y:300,type:2,hp:2}];
for(const b of document.querySelectorAll('.ctl')){let n=b.dataset.k;for(const e of ['pointerdown','pointerenter'])b.addEventListener(e,x=>{if(e==='pointerdown')b.setPointerCapture(x.pointerId);k[n]=1});for(const e of ['pointerup','pointercancel','pointerleave'])b.addEventListener(e,()=>k[n]=0)}
function px(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function hero(x,y,t,dir){
g.save();g.translate(Math.round(x),Math.round(y));g.scale(dir,1);
const run=Math.abs(p.vx)>0.1, bob=run?(Math.floor(t/4)%2)*2:(Math.floor(t/16)%2);
if(k.dash&&run){for(let n=4;n>=1;n--){g.save();g.globalAlpha=.07*n;g.translate(-n*13,0);hero96(bob,false,false);g.restore()}}
hero96(bob,k.sword,k.shot);g.restore()}
function hero96(bob,atk,shoot){
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y+bob,w,h)}, D=(x,y,c)=>R(x,y,2,2,c);
// silhouette hair + long braid
R(-23,-76,46,9,'#8b4b0a');R(-26,-69,52,20,'#e79a13');R(-21,-72,42,18,'#ffc62d');
for(let i=0;i<8;i++){let x=-28-i*7,y=-45+i*3;R(x,y,11,9,'#b8660c');R(x+2,y-2,8,8,'#f6a915');R(x+4,y,4,4,'#ffd94c')}
R(-83,-21,10,4,'#d62527');R(-77,-25,7,12,'#e62b2b');
// helmet wings
R(-31,-75,9,7,'#c9e6ff');R(-38,-79,10,6,'#f7ffff');R(-43,-76,9,5,'#d9f1ff');
R(22,-75,9,7,'#c9e6ff');R(29,-79,10,6,'#f7ffff');R(36,-76,9,5,'#d9f1ff');
// circlet
R(-20,-71,40,6,'#b91f1f');R(-15,-74,30,5,'#f2b72a');R(-4,-76,8,7,'#e43b2e');D(-2,-74,'#fff17a');
// face
R(-18,-64,36,29,'#f2b483');R(-15,-61,30,25,'#ffd0a0');R(-18,-55,5,12,'#e89a6d');R(13,-55,5,12,'#e89a6d');
// bangs
R(-18,-65,9,9,'#f5b31d');R(-9,-67,8,10,'#ffc832');R(1,-66,8,9,'#f5ad18');R(9,-64,9,8,'#e99710');
// eyes 2px detail
R(-11,-53,5,7,'#173a66');R(7,-53,5,7,'#173a66');D(-10,-53,'#62bfff');D(8,-53,'#62bfff');R(-4,-42,8,2,'#c87368');
// torso armor/dress
R(-15,-34,30,24,'#f8f5e9');R(-12,-34,24,8,'#d52c2c');R(-8,-29,16,12,'#2d9b79');R(-3,-28,6,7,'#e9c53a');
R(-24,-29,10,23,'#f5f4eb');R(14,-29,10,23,'#f5f4eb');R(-21,-25,7,13,'#d62b2b');R(14,-25,7,13,'#d62b2b');
// skirt panels
R(-18,-12,36,7,'#f7f5e8');R(-23,-7,13,17,'#f7f5e8');R(-7,-7,14,20,'#e9edf5');R(10,-7,13,17,'#f7f5e8');R(-22,-5,11,4,'#d52b2b');R(11,-5,11,4,'#d52b2b');
// boots
R(-15,9,10,11,'#e4a91f');R(5,9,10,11,'#e4a91f');R(-18,17,14,5,'#fff1a0');R(4,17,14,5,'#fff1a0');
if(atk){R(20,-29,10,8,'#dcae28');R(28,-31,48,5,'#d8f3ff');R(31,-32,43,2,'#fff');R(72,-35,7,12,'#eefcff');R(18,-35,5,16,'#f1c532');}
else if(shoot){R(21,-28,12,8,'#e4c135');R(34,-30,12,10,'#4ed9ff');R(47,-32,14,14,'#9cf7ff');R(61,-29,10,8,'#e7ffff');}
else {R(18,-28,10,7,'#e1b32b');R(22,-31,5,13,'#fff0a0');}
}function enemy(e){if(e.type===0){px(e.x-14,e.y-45,28,24,'#329342');px(e.x-16,e.y-22,32,22,'#684426');px(e.x+12,e.y-34,13,30,'#9b622c')}else if(e.type===1){px(e.x-14,e.y-45,28,28,'#eee');px(e.x-18,e.y-50,36,12,'#d9232e');px(e.x-17,e.y-20,34,20,'#c8202a')}else{px(e.x-15,e.y-12,30,18,'#185fc4');px(e.x-31,e.y-20,18,13,'#5427a7');px(e.x+13,e.y-20,18,13,'#5427a7')}}
function draw(){p.t++;let sp=k.dash?8:3;p.vx=(k.right-k.left)*sp;if(p.vx)p.dir=Math.sign(p.vx);p.x=Math.max(30,Math.min(900,p.x+p.vx));if(k.jump&&p.ground){p.vy=-11;p.ground=0}p.vy+=.6;p.y+=p.vy;if(p.y>=410){p.y=410;p.vy=0;p.ground=1}if(k.shot&&p.t%8===0)shots.push({x:p.x+p.dir*25,y:p.y-35,v:9*p.dir});shots.forEach(q=>q.x+=q.v);for(const q of shots)for(const e of enemies)if(e.hp>0&&Math.abs(q.x-e.x)<24&&Math.abs(q.y-(e.y-25))<30){e.hp--;q.x=-99;if(e.hp<=0)p.score+=100}shots=shots.filter(q=>q.x>0&&q.x<960);
let grad=g.createLinearGradient(0,0,0,540);grad.addColorStop(0,'#0879ee');grad.addColorStop(1,'#76caff');g.fillStyle=grad;g.fillRect(0,0,960,540);
for(let i=0;i<7;i++){let x=i*170-40;px(x,240,120,110,'#1e6c72');px(x+30,205,60,60,'#e8edf2')}
px(0,410,960,130,'#754522');for(let x=0;x<960;x+=32){px(x,410,32,12,'#59b83b');px(x+4,430,22,16,'#9a6634')}
for(const e of enemies)if(e.hp>0)enemy(e);hero(p.x,p.y,p.t,p.dir);for(const q of shots){px(q.x,q.y,18,5,'#bdfaff');px(q.x+5,q.y-3,9,11,'#38a9ff')}
g.fillStyle='#102a62dd';g.fillRect(0,0,960,55);g.fillStyle='white';g.font='bold 22px monospace';g.fillText('HP '+('♥'.repeat(p.hp))+'   SCORE '+String(p.score).padStart(6,'0'),24,35);g.fillStyle='#ffe36b';g.fillText('STAGE 1  SKY DASH QUEST',620,35);requestAnimationFrame(draw)}draw();
</script></body></html>
