<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b45"><title>SKY DASH QUEST v1.1 Pixel Prototype</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050914;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}#wrap{width:100vw;height:100vh;display:grid;place-items:center}canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);image-rendering:pixelated;background:#1689e8}.ctl{position:fixed;border:2px solid #fff9;border-radius:50%;width:76px;height:76px;color:white;font:bold 13px monospace;display:grid;place-items:center;user-select:none}.l{left:18px;bottom:24px}.r{left:102px;bottom:24px}.d{right:102px;bottom:105px;background:#a98514cc}.j{right:18px;bottom:105px;background:#075db5cc}.s{right:102px;bottom:20px;background:#a52b2bcc}.p{right:18px;bottom:20px;background:#7625bacc}</style></head><body><div id="wrap"><canvas id="c" width="960" height="540"></canvas></div><div class="ctl l" data-k="left">◀</div><div class="ctl r" data-k="right">▶</div><div class="ctl d" data-k="dash">DASH</div><div class="ctl j" data-k="jump">JUMP</div><div class="ctl s" data-k="sword">SWORD</div><div class="ctl p" data-k="shot">SHOT</div><script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;let k={},p={x:150,y:410,vx:0,vy:0,ground:1,dir:1,t:0,hp:5,score:0},shots=[],enemies=[{x:650,y:410,type:0,hp:3},{x:790,y:410,type:1,hp:2},{x:860,y:300,type:2,hp:2}];
for(const b of document.querySelectorAll('.ctl')){let n=b.dataset.k;for(const e of ['pointerdown','pointerenter'])b.addEventListener(e,x=>{if(e==='pointerdown')b.setPointerCapture(x.pointerId);k[n]=1});for(const e of ['pointerup','pointercancel','pointerleave'])b.addEventListener(e,()=>k[n]=0)}
function px(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function hero(x,y,t,dir){g.save();g.translate(x,y);g.scale(dir,1);let bob=Math.floor(t/10)%2*2;
px(-13,-62+bob,26,24,'#f4b321');px(-18,-66+bob,9,18,'white');px(9,-66+bob,9,18,'white');px(-10,-58+bob,20,19,'#ffd2a1');px(-9,-44+bob,18,24,'white');px(-15,-40+bob,7,18,'#d72c28');px(8,-40+bob,7,18,'#d72c28');px(-10,-20,8,20,'#f5d03c');px(2,-20,8,20,'#f5d03c');px(-7,-54+bob,3,5,'#14213d');px(5,-54+bob,3,5,'#14213d');if(k.sword){px(12,-37,35,5,'#eaf8ff');px(43,-40,5,11,'#f7d238')}g.restore()}
function enemy(e){if(e.type===0){px(e.x-14,e.y-45,28,24,'#329342');px(e.x-16,e.y-22,32,22,'#684426');px(e.x+12,e.y-34,13,30,'#9b622c')}else if(e.type===1){px(e.x-14,e.y-45,28,28,'#eee');px(e.x-18,e.y-50,36,12,'#d9232e');px(e.x-17,e.y-20,34,20,'#c8202a')}else{px(e.x-15,e.y-12,30,18,'#185fc4');px(e.x-31,e.y-20,18,13,'#5427a7');px(e.x+13,e.y-20,18,13,'#5427a7')}}
function draw(){p.t++;let sp=k.dash?8:3;p.vx=(k.right-k.left)*sp;if(p.vx)p.dir=Math.sign(p.vx);p.x=Math.max(30,Math.min(900,p.x+p.vx));if(k.jump&&p.ground){p.vy=-11;p.ground=0}p.vy+=.6;p.y+=p.vy;if(p.y>=410){p.y=410;p.vy=0;p.ground=1}if(k.shot&&p.t%8===0)shots.push({x:p.x+p.dir*25,y:p.y-35,v:9*p.dir});shots.forEach(q=>q.x+=q.v);for(const q of shots)for(const e of enemies)if(e.hp>0&&Math.abs(q.x-e.x)<24&&Math.abs(q.y-(e.y-25))<30){e.hp--;q.x=-99;if(e.hp<=0)p.score+=100}shots=shots.filter(q=>q.x>0&&q.x<960);
let grad=g.createLinearGradient(0,0,0,540);grad.addColorStop(0,'#0879ee');grad.addColorStop(1,'#76caff');g.fillStyle=grad;g.fillRect(0,0,960,540);
for(let i=0;i<7;i++){let x=i*170-40;px(x,240,120,110,'#1e6c72');px(x+30,205,60,60,'#e8edf2')}
px(0,410,960,130,'#754522');for(let x=0;x<960;x+=32){px(x,410,32,12,'#59b83b');px(x+4,430,22,16,'#9a6634')}
for(const e of enemies)if(e.hp>0)enemy(e);hero(p.x,p.y,p.t,p.dir);for(const q of shots){px(q.x,q.y,18,5,'#bdfaff');px(q.x+5,q.y-3,9,11,'#38a9ff')}
g.fillStyle='#102a62dd';g.fillRect(0,0,960,55);g.fillStyle='white';g.font='bold 22px monospace';g.fillText('HP '+('♥'.repeat(p.hp))+'   SCORE '+String(p.score).padStart(6,'0'),24,35);g.fillStyle='#ffe36b';g.fillText('STAGE 1  SKY DASH QUEST',620,35);requestAnimationFrame(draw)}draw();
</script></body></html>
