<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b45"><title>SKY DASH QUEST v1.3 Hi-Pixel Hero Test</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050914;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0 0 116px}canvas{display:block;width:100vw;height:auto;max-height:calc(100vh - 116px);aspect-ratio:16/9;image-rendering:pixelated;background:#1689e8}.ctl{position:fixed;z-index:5;border:2px solid #fff9;border-radius:50%;width:72px;height:72px;color:white;font:bold 13px monospace;display:grid;place-items:center;user-select:none}.l{left:18px;bottom:20px}.r{left:98px;bottom:20px}.d{right:98px;bottom:96px;background:#a98514cc}.j{right:18px;bottom:96px;background:#075db5cc}.s{right:98px;bottom:16px;background:#a52b2bcc}.p{right:18px;bottom:16px;background:#7625bacc}@media(orientation:landscape){#wrap{padding:0}.ctl{width:68px;height:68px}.l{bottom:14px}.r{bottom:14px}.d{bottom:88px}.j{bottom:88px}.s,.p{bottom:12px}}</style></head><body><div id="wrap"><canvas id="c" width="960" height="540"></canvas></div><div class="ctl l" data-k="left">◀</div><div class="ctl r" data-k="right">▶</div><div class="ctl d" data-k="dash">DASH</div><div class="ctl j" data-k="jump">JUMP</div><div class="ctl s" data-k="sword">SWORD</div><div class="ctl p" data-k="shot">SHOT</div><script>
const c=document.getElementById('c'),g=c.getContext('2d');document.documentElement.style.background='#050914';g.imageSmoothingEnabled=false;let k={},p={x:150,y:410,vx:0,vy:0,ground:1,dir:1,t:0,hp:5,score:0},shots=[],enemies=[{x:650,y:410,type:0,hp:3},{x:790,y:410,type:1,hp:2},{x:860,y:300,type:2,hp:2}];
for(const b of document.querySelectorAll('.ctl')){let n=b.dataset.k;for(const e of ['pointerdown','pointerenter'])b.addEventListener(e,x=>{if(e==='pointerdown')b.setPointerCapture(x.pointerId);k[n]=1});for(const e of ['pointerup','pointercancel','pointerleave'])b.addEventListener(e,()=>k[n]=0)}
function px(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function hero(x,y,t,dir){
g.save();g.translate(Math.round(x),Math.round(y));g.scale(dir,1);
const moving=Math.abs(p.vx)>0.1,bob=moving?(Math.floor(t/4)%2)*2:(Math.floor(t/14)%2);
const dash=k.dash&&moving, atk=k.sword, shoot=k.shot;
if(dash){g.globalAlpha=.18;for(let z=1;z<=3;z++){g.save();g.translate(-z*18,0);heroBody(bob,atk,shoot);g.restore()}g.globalAlpha=1}
heroBody(bob,atk,shoot);g.restore()}
function heroBody(bob,atk,shoot){
const P=(x,y,w,h,c)=>px(x,y+bob,w,h,c);
// braid: high-pixel segmented gold hair
for(let i=0;i<7;i++){let xx=-30-i*7,yy=-42+i*3;P(xx,yy,9,8,i%2?'#e89116':'#ffc52c');P(xx+2,yy+1,4,3,'#ffe477')}
P(-17,-68,34,18,'#d88b13');P(-14,-72,28,10,'#ffc52c'); // hair
P(-15,-64,30,24,'#ffd2a1'); // face
P(-12,-67,24,5,'#e62822');P(-8,-71,16,5,'#f2b51d'); // circlet
P(-24,-69,10,6,'#f7f7ed');P(-30,-65,14,5,'#dcecff');P(14,-69,10,6,'#f7f7ed');P(20,-65,14,5,'#dcecff'); // wings
P(-9,-57,4,6,'#1762a5');P(6,-57,4,6,'#1762a5');P(-7,-48,14,3,'#e58c78'); // face detail
P(-13,-40,26,25,'#f7f4e9');P(-10,-37,20,8,'#d92c2a');P(-16,-34,6,20,'#f7f4e9');P(10,-34,6,20,'#f7f4e9');
P(-10,-16,8,16,'#efb526');P(2,-16,8,16,'#efb526');P(-13,-3,12,5,'#fff2a6');P(1,-3,12,5,'#fff2a6');
if(atk){P(14,-34,34,5,'#eaf9ff');P(44,-37,6,11,'#fff');P(10,-38,8,12,'#e8b72d');P(48,-35,18,2,'#ffe767')}
else if(shoot){P(15,-34,13,7,'#e9f6ff');P(29,-35,11,9,'#40cfff');P(41,-37,10,13,'#aaf7ff')}
else{P(14,-34,13,6,'#e8b72d')}
}function enemy(e){if(e.type===0){px(e.x-14,e.y-45,28,24,'#329342');px(e.x-16,e.y-22,32,22,'#684426');px(e.x+12,e.y-34,13,30,'#9b622c')}else if(e.type===1){px(e.x-14,e.y-45,28,28,'#eee');px(e.x-18,e.y-50,36,12,'#d9232e');px(e.x-17,e.y-20,34,20,'#c8202a')}else{px(e.x-15,e.y-12,30,18,'#185fc4');px(e.x-31,e.y-20,18,13,'#5427a7');px(e.x+13,e.y-20,18,13,'#5427a7')}}
function draw(){p.t++;let sp=k.dash?8:3;p.vx=(k.right-k.left)*sp;if(p.vx)p.dir=Math.sign(p.vx);p.x=Math.max(30,Math.min(900,p.x+p.vx));if(k.jump&&p.ground){p.vy=-11;p.ground=0}p.vy+=.6;p.y+=p.vy;if(p.y>=410){p.y=410;p.vy=0;p.ground=1}if(k.shot&&p.t%8===0)shots.push({x:p.x+p.dir*25,y:p.y-35,v:9*p.dir});shots.forEach(q=>q.x+=q.v);for(const q of shots)for(const e of enemies)if(e.hp>0&&Math.abs(q.x-e.x)<24&&Math.abs(q.y-(e.y-25))<30){e.hp--;q.x=-99;if(e.hp<=0)p.score+=100}shots=shots.filter(q=>q.x>0&&q.x<960);
let grad=g.createLinearGradient(0,0,0,540);grad.addColorStop(0,'#0879ee');grad.addColorStop(1,'#76caff');g.fillStyle=grad;g.fillRect(0,0,960,540);
for(let i=0;i<7;i++){let x=i*170-40;px(x,240,120,110,'#1e6c72');px(x+30,205,60,60,'#e8edf2')}
px(0,410,960,130,'#754522');for(let x=0;x<960;x+=32){px(x,410,32,12,'#59b83b');px(x+4,430,22,16,'#9a6634')}
for(const e of enemies)if(e.hp>0)enemy(e);hero(p.x,p.y,p.t,p.dir);for(const q of shots){px(q.x,q.y,18,5,'#bdfaff');px(q.x+5,q.y-3,9,11,'#38a9ff')}
g.fillStyle='#102a62dd';g.fillRect(0,0,960,55);g.fillStyle='white';g.font='bold 22px monospace';g.fillText('HP '+('♥'.repeat(p.hp))+'   SCORE '+String(p.score).padStart(6,'0'),24,35);g.fillStyle='#ffe36b';g.fillText('STAGE 1  SKY DASH QUEST',620,35);requestAnimationFrame(draw)}draw();
</script></body></html>
